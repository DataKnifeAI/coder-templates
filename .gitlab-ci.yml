# GitLab CI for Coder Templates
# Tests Terraform configs and pushes to Coder when changes land on main
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CODER_URL          - Coder instance URL (e.g. https://coder.dataknife.net)
#   CODER_SESSION_TOKEN - Long-lived token: coder token create --lifetime 8760h --name "GitLab CI"

stages:
  - test
  - deploy

variables:
  TERRAFORM_VERSION: "1.14.1"

.test_template: &test_template
  stage: test
  tags:
    - kubernetes
  image:
    name: hashicorp/terraform:${TERRAFORM_VERSION}
    entrypoint: [""]
  before_script:
    - cd templates/${TEMPLATE_NAME}
  script:
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive -diff

test:kubernetes:
  <<: *test_template
  variables:
    TEMPLATE_NAME: kubernetes

test:dkai-dev:
  <<: *test_template
  variables:
    TEMPLATE_NAME: dkai-dev

test:dkai-arch:
  <<: *test_template
  variables:
    TEMPLATE_NAME: dkai-arch
  # hashicorp/terraform image is minimal (no bash); check-dkai-startup-shell.sh needs bash and bash -n
  before_script:
    - |
      if ! command -v bash >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then apk add --no-cache bash
        elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq bash
        else echo "install bash or use an image that includes it" >&2; exit 1
        fi
      fi
    - cd templates/${TEMPLATE_NAME}
  script:
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive -diff
    - cd "$CI_PROJECT_DIR" && bash scripts/check-dkai-startup-shell.sh

test:dkai-agent:
  <<: *test_template
  variables:
    TEMPLATE_NAME: dkai-agent
  # Startup shell is checked in test:dkai-arch (scripts/check-dkai-startup-shell.sh covers all Arch templates)

push-to-coder:
  stage: deploy
  tags:
    - kubernetes
  image: ubuntu:24.04
  needs:
    - test:kubernetes
    - test:dkai-dev
    - test:dkai-arch
    - test:dkai-agent
  before_script:
    - apt-get update && apt-get install -y curl ca-certificates
    - curl -fsSL https://coder.dataknife.net/install.sh | sh -s --
    - coder version
  script:
    - |
      for template in kubernetes dkai-dev dkai-arch dkai-agent; do
        if [ -d "templates/$template" ]; then
          echo "Pushing template: $template"
          coder templates push "$template" --directory "templates/$template" --activate=false -y
        fi
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
